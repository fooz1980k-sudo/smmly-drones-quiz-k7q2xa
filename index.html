:root{--navy:#0B1F3A;--navy2:#13305A;--gold:#C9A34E;--goldl:#E9D9A6;--ink:#1B2638;--grey:#6B7487;--light:#EEF2F8;--ok:#1E8E5A;--bad:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:CairoE,Cairo,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1d3f70 0%,#0B1F3A 55%,#071429 100%) fixed;color:var(--ink);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;padding:6px 2px 14px}
.brand{font-weight:900;color:var(--gold);font-size:17px;white-space:nowrap}
.langs{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(201,163,78,.5);border-radius:30px;padding:3px}
.langs button{border:0;background:transparent;color:#DCE3EE;font:inherit;font-weight:700;font-size:13px;padding:4px 14px;border-radius:30px;cursor:pointer}
.langs button.on{background:var(--gold);color:var(--navy)}
.hero{color:#fff;text-align:center;padding:10px 6px 18px}
.hero .kicker{color:var(--goldl);font-size:13px;font-weight:600}
.hero h1{margin:4px 0 2px;font-size:30px;line-height:1.3;font-weight:900}
.hero h1 span{color:var(--gold)}
.hero p{color:#B9C6DA;margin:6px auto 0;max-width:520px;font-size:14px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--gold),#E6C878,var(--gold))}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvl{border:1.5px solid #E5DCC3;background:#FFFCF4;border-radius:16px;padding:14px;text-align:start;cursor:pointer;font:inherit;color:var(--ink);transition:.15s;display:flex;flex-direction:column;gap:2px}
.lvl:hover,.lvl:focus-visible{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 18px rgba(201,163,78,.25);outline:none}
.lvl b{font-size:18px;color:var(--navy)}
.lvl small{color:var(--grey);font-size:12.5px}
.lvl .cnt{display:inline-block;margin-top:6px;background:var(--navy);color:var(--goldl);border-radius:20px;padding:0 10px;font-size:12px;font-weight:700;align-self:flex-start}
.lvl.all{grid-column:1/-1;background:linear-gradient(135deg,var(--navy2),var(--navy));border-color:var(--gold)}
.lvl.all b{color:var(--gold)}.lvl.all small{color:#C9D3E3}.lvl.all .cnt{background:var(--gold);color:var(--navy)}
.sec-title{font-weight:800;color:var(--navy);margin:0 0 12px;font-size:16px}
.tip{margin-top:14px;font-size:12.5px;color:var(--grey);background:var(--light);border-radius:12px;padding:8px 12px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--grey);font-weight:700;margin-bottom:8px;gap:8px}
.pill{background:var(--navy);color:var(--goldl);border-radius:20px;padding:1px 10px;font-size:12px}
.bar{height:8px;background:var(--light);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E6C878);width:0;transition:width .3s}
.q{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;font-size:15.5px;color:var(--ink);background:#F7F9FC;border:1.5px solid #DCE3EE;border-radius:14px;padding:12px 14px;cursor:pointer;transition:.12s;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--gold);background:#FFFCF4}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:disabled{cursor:default}
.opt.ok{background:#EAF7F0;border-color:var(--ok)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:#FCECEA;border-color:var(--bad)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px;display:none}
.fb.show{display:block;animation:pop .2s ease}
.fb.ok{background:#EAF7F0;border:1px solid #BFE5D0}.fb.bad{background:#FCECEA;border:1px solid #F1C6C0}
.fb b.h{display:block;font-size:15.5px;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)}.fb.bad b.h{color:var(--bad)}
.src{display:inline-block;direction:ltr;color:#9A7A2E;font-size:11.5px;font-weight:700;margin-top:4px}
@keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:none;opacity:1}}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-size:15px;flex:1;min-width:130px}
.btn.gold{background:linear-gradient(135deg,#E6C878,#C9A34E);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid #DCE3EE;color:var(--grey)}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center}
.ring{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#EEF2F8 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:32px;color:var(--navy);line-height:1;direction:ltr}.ring small{color:var(--grey);font-size:12px;direction:ltr}
.res h2{margin:4px 0;color:var(--navy);font-size:22px}
.res p{color:var(--grey);margin:0 0 6px}
.review{text-align:start;margin-top:14px}
.review details{background:#F7F9FC;border:1px solid #E3E8F0;border-radius:12px;padding:8px 12px;margin-bottom:8px}
.review summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
.review .ans{font-size:13.5px;margin-top:6px}
.review .ans .c{color:var(--ok);font-weight:800}.review .ans .w{color:var(--bad);font-weight:700}
footer{color:#8FA0BA;text-align:center;font-size:12px;margin-top:18px;line-height:1.6}
footer b{color:var(--goldl);font-weight:700}
.hidden{display:none!important}
html[dir=ltr] .opt,html[dir=ltr] .lvl{text-align:left}
@media (max-width:480px){.hero h1{font-size:25px}.q{font-size:17.5px}.card{padding:16px;border-radius:18px}.levels{grid-template-columns:1fr}.opt{font-size:15px}.btn{min-width:0}}
</style></head>
<body>

ne?", "o": ["Never registered", "Yes, no difference in registration", "Commercial only", "Recreational only"], "e": "There is no difference; both are registered under Part 48."}}, {"id": 67, "l": "e", "a": 0, "s": "S20", "ar": {"q": "ما معنى «Propeller»؟", "o": ["مروحة", "بطارية", "كاميرا", "هيكل"], "e": "Propeller = المروحة، وهي التي تولّد الدفع."}, "en": {"q": "What does \"Propeller\" mean?", "o": ["مروحة (propeller)", "بطارية (battery)", "كاميرا (camera)", "هيكل (frame)"], "e": "Propeller = مروحة, the part that generates thrust."}}, {"id": 68, "l": "e", "a": 0, "s": "S20", "ar": {"q": "ما معنى «Flight Controller»؟", "o": ["وحدة التحكم في الطيران", "مراقب جوي", "المطار", "الطيار"], "e": "Flight Controller = وحدة التحكم في الطيران، «عقل» الدرون."}, "en": {"q": "What does \"Flight Controller\" mean?", "o": ["وحدة التحكم في الطيران", "مراقب جوي (air traffic controller)", "المطار (airport)", "الطيار (pilot)"], "e": "Flight Controller = وحدة التحكم في الطيران, the drone's \"brain\"."}}, {"id": 25, "l": "m", "a": 1, "s": "S10", "ar": {"q": "يجب التسجيل حتى لو كان الوزن أقل من 250 جرامًا إذا:", "o": ["كان لونه أسود", "حمل حساسًا يلتقط بيانات شخصية", "طار داخل البيت", "كان جديدًا"], "e": "يجب التسجيل كذلك إذا حمل حساسًا يلتقط بيانات شخصية، أو بيانات مسح وبيانات جغرافية مكانية."}, "en": {"q": "Registration is required even below 250 g if the drone:", "o": ["Is black", "Carries a sensor that captures personal data", "Flies indoors", "Is new"], "e": "Registration is also required if it carries a sensor capturing personal data, or survey/geospatial data."}}, {"id": 26, "l": "m", "a": 1, "s": "S12", "ar": {"q": "الحد الأقصى لوزن الإقلاع في الفئة المفتوحة:", "o": ["أقل من 5 كجم", "أقل من 25 كجم", "أقل من 150 كجم", "بلا حد"], "e": "الفئة المفتوحة: الوزن الأقصى للإقلاع أقل من 25 كجم."}, "en": {"q": "Maximum take-off mass in the Open category:", "o": ["Under 5 kg", "Under 25 kg", "Under 150 kg", "No limit"], "e": "Open category: MTOM under 25 kg."}}, {"id": 27, "l": "m", "a": 1, "s": "S12", "ar": {"q": "طائرة وزنها 40 كجم تتبع:", "o": ["الفئة المفتوحة", "الفئة الخاصة", "لا تحتاج تصنيفًا", "فئة الألعاب"], "e": "الفئة الخاصة للوزن من 25 إلى 150 كجم."}, "en": {"q": "A 40 kg aircraft falls under:", "o": ["Open category", "Specific category", "No classification needed", "Toy category"], "e": "The Specific category covers 25 to 150 kg."}}, {"id": 28, "l": "m", "a": 1, "s": "S13", "ar": {"q": "أي عملية تتبع الفئة الخاصة؟", "o": ["تصوير نهاري على 50 م", "الطيران الليلي", "طيران ضمن خط الرؤية نهارًا", "تحويم منخفض"], "e": "الطيران الليلي من أمثلة عمليات الفئة الخاصة."}, "en": {"q": "Which operation falls under the Specific category?", "o": ["Daytime photography at 50 m", "Night flying", "Daytime flight within line of sight", "Low hovering"], "e": "Night flying is an example of a Specific-category operation."}}, {"id": 29, "l": "m", "a": 0, "s": "S13", "ar": {"q": "أي عملية تتبع الفئة الخاصة كذلك؟", "o": ["إسقاط بضائع", "تصوير حديقة نهارًا", "هبوط عادي", "شحن البطارية"], "e": "نقل البضائع أو إسقاطها من أمثلة عمليات الفئة الخاصة."}, "en": {"q": "Which operation also falls under the Specific category?", "o": ["Dropping cargo", "Photographing a park by day", "A normal landing", "Charging the battery"], "e": "Carrying or dropping goods is an example of a Specific-category operation."}}, {"id": 30, "l": "m", "a": 1, "s": "S13", "ar": {"q": "عروض الدرونز الضوئية بعدة طائرات تتبع:", "o": ["الفئة المفتوحة", "الفئة الخاصة", "لا تحتاج شيئًا", "الطيران الترفيهي"], "e": "تشغيل عدة طائرات معًا، مثل العروض الضوئية، من أمثلة الفئة الخاصة."}, "en": {"q": "Light shows with multiple drones fall under:", "o": ["Open category", "Specific category", "Nothing required", "Recreational flying"], "e": "Operating several aircraft together, such as light shows, is a Specific-category example."}}, {"id": 31, "l": "m", "a": 1, "s": "S13", "ar": {"q": "«BVLOS» تعني:", "o": ["ضمن خط الرؤية", "خارج مدى الرؤية البصري", "وضع البطارية", "نوع مروحة"], "e": "Beyond Visual Line of Sight، وهي من عمليات الفئة الخاصة."}, "en": {"q": "\"BVLOS\" means:", "o": ["Within line of sight", "Beyond visual line of sight", "A battery mode", "A propeller type"], "e": "Beyond Visual Line of Sight — a Specific-category operation."}}, {"id": 32, "l": "m", "a": 1, "s": "S20", "ar": {"q": "وحدة IMU تجمع:", "o": ["GPS وكاميرا", "جيروسكوب ومقياس تسارع", "بطارية وESC", "مروحة ومحرك"], "e": "IMU = جيروسكوب (معدل الدوران) + مقياس تسارع (الميل والتسارع)."}, "en": {"q": "The IMU combines:", "o": ["GPS and camera", "Gyroscope and accelerometer", "Battery and ESC", "Propeller and motor"], "e": "IMU = gyroscope (rotation rate) + accelerometer (tilt and acceleration)."}}, {"id": 33, "l": "m", "a": 0, "s": "S20", "ar": {"q": "الجيروسكوب يقيس:", "o": ["معدل الدوران", "الضغط", "الموقع", "الحرارة"], "e": "الجيروسكوب يقيس معدل الدوران."}, "en": {"q": "The gyroscope measures:", "o": ["Rotation rate", "Pressure", "Position", "Temperature"], "e": "The gyroscope measures rate of rotation."}}, {"id": 34, "l": "m", "a": 1, "s": "S20", "ar": {"q": "وظيفة البوصلة المغناطيسية:", "o": ["قياس الارتفاع", "تحديد الاتجاه", "شحن البطارية", "نقل الفيديو"], "e": "البوصلة تعطي الاتجاه."}, "en": {"q": "The role of the magnetic compass:", "o": ["Measuring altitude", "Determining heading", "Charging the battery", "Transmitting video"], "e": "The compass provides heading (direction)."}}, {"id": 35, "l": "m", "a": 1, "s": "S16", "ar": {"q": "في الطيران المستقيم المستوي:", "o": ["الرفع > الوزن", "الرفع = الوزن والدفع = السحب", "الدفع = صفر", "السحب > الدفع"], "e": "في الطيران المستقيم المستوي تتوازن القوى: الرفع = الوزن، والدفع = السحب."}, "en": {"q": "In straight and level flight:", "o": ["Lift > weight", "Lift = weight and thrust = drag", "Thrust = zero", "Drag > thrust"], "e": "In straight and level flight the forces balance: lift = weight, thrust = drag."}}, {"id": 36, "l": "m", "a": 1, "s": "S16", "ar": {"q": "إذا زاد الرفع على الوزن:", "o": ["تهبط الطائرة", "تصعد", "تثبت", "تنعرج"], "e": "إذا زاد الرفع على الوزن صعدت الطائرة."}, "en": {"q": "If lift exceeds weight:", "o": ["The aircraft descends", "It climbs", "It holds", "It yaws"], "e": "When lift exceeds weight, the aircraft climbs."}}, {"id": 37, "l": "m", "a": 0, "s": "S21", "ar": {"q": "Roll وPitch في الرباعية يحدثان بسبب:", "o": ["فرق دفع بين جهتين متقابلتين", "تغيير الكاميرا", "تغيير البطارية", "الرياح فقط"], "e": "فرق الدفع يُميل الطائرة، والميل يولّد حركة أفقية."}, "en": {"q": "Roll and pitch on a quadcopter are caused by:", "o": ["A thrust difference between two opposite sides", "Changing the camera", "Changing the battery", "Wind only"], "e": "The thrust difference tilts the drone, and the tilt produces horizontal motion."}}, {"id": 38, "l": "m", "a": 1, "s": "S21, S29", "ar": {"q": "الانعراج (Yaw) في الرباعية يتم عن طريق:", "o": ["إمالة الجسم", "زيادة سرعة زوج المراوح الذي يدور في اتجاه وتقليل الزوج الآخر", "إطفاء محرك", "رفع الخانق فقط"], "e": "مع ثبات الدفع الكلي، تدور الطائرة حول محورها الرأسي بسبب عزم رد الفعل."}, "en": {"q": "Yaw on a quadcopter is achieved by:", "o": ["Tilting the body", "Speeding up the propeller pair spinning one way and slowing the other pair", "Turning off a motor", "Raising throttle only"], "e": "With total thrust unchanged, the drone rotates about its vertical axis due to reaction torque."}}, {"id": 39, "l": "m", "a": 1, "s": "S17", "ar": {"q": "وضع Loiter يثبت:", "o": ["الارتفاع فقط", "الارتفاع والموقع والاتجاه", "لا شيء", "الكاميرا"], "e": "Loiter يثبت الارتفاع والموقع والاتجاه، وعند ترك العصي تقف الطائرة. يحتاج GPS."}, "en": {"q": "Loiter mode holds:", "o": ["Altitude only", "Altitude, position and heading", "Nothing", "The camera"], "e": "Loiter holds altitude, position and heading; releasing the sticks stops the drone. Requires GPS."}}, {"id": 40, "l": "m", "a": 1, "s": "S17", "ar": {"q": "وضع AltHold يثبت:", "o": ["الموقع", "الارتفاع، والطيار يتحكم بالموقع", "يعود للمنزل", "يهبط"], "e": "AltHold يثبت الارتفاع فقط، والطيار يتحكم بالموقع."}, "en": {"q": "AltHold mode holds:", "o": ["Position", "Altitude, while the pilot controls position", "Returns home", "Lands"], "e": "AltHold holds altitude only; the pilot controls position."}}, {"id": 41, "l": "m", "a": 1, "s": "S17", "ar": {"q": "في وضع Stabilize:", "o": ["كل شيء آلي", "تسوية تلقائية للميل، والخانق يدوي", "ينفذ مهمة", "يهبط"], "e": "Stabilize يدوي مع تسوية تلقائية للميل؛ الخانق والانعراج يدويان."}, "en": {"q": "In Stabilize mode:", "o": ["Everything is automatic", "Automatic self-leveling; throttle is manual", "It runs a mission", "It lands"], "e": "Stabilize is manual with automatic leveling; throttle and yaw are manual."}}, {"id": 42, "l": "m", "a": 0, "s": "S17", "ar": {"q": "وضع Auto:", "o": ["ينفذ مهمة مبرمجة مسبقًا", "يدوي بالكامل", "يطفئ الطائرة", "يصوّر فقط"], "e": "Auto ينفذ مهمة مبرمجة مسبقًا."}, "en": {"q": "Auto mode:", "o": ["Executes a pre-programmed mission", "Is fully manual", "Shuts the drone down", "Only takes photos"], "e": "Auto executes a pre-programmed mission."}}, {"id": 43, "l": "m", "a": 1, "s": "S17", "ar": {"q": "ما يلزم لعمل RTL بشكل موثوق:", "o": ["كاميرا", "GPS وبوصلة موثوقة", "إضاءة", "مروحة إضافية"], "e": "RTL يحتاج GPS وبوصلة موثوقة ليعرف موقع المنزل واتجاهه."}, "en": {"q": "What RTL needs to work reliably:", "o": ["A camera", "GPS and a reliable compass", "Lighting", "An extra propeller"], "e": "RTL needs GPS and a reliable compass to know where home is and which way to go."}}, {"id": 44, "l": "m", "a": 1, "s": "S22", "ar": {"q": "جهد تخزين خلية LiPo تقريبًا:", "o": ["3.0 فولت", "نحو 3.8 فولت", "4.5 فولت", "1.5 فولت"], "e": "التخزين بين 3.80 و3.85 فولت للخلية عبر وضع Storage في الشاحن."}, "en": {"q": "Approximate LiPo cell storage voltage:", "o": ["3.0 V", "About 3.8 V", "4.5 V", "1.5 V"], "e": "Store at 3.80–3.85 V per cell using the charger's Storage mode."}}, {"id": 45, "l": "m", "a": 0, "s": "S22b", "ar": {"q": "لا تُنزل خلية LiPo تحت:", "o": ["3.0 فولت", "3.9 فولت", "4.2 فولت", "3.7 فولت"], "e": "الهبوط عند نحو 3.5–3.6 فولت للخلية، ولا يُنزل أبدًا تحت 3.0 فولت."}, "en": {"q": "Never discharge a LiPo cell below:", "o": ["3.0 V", "3.9 V", "4.2 V", "3.7 V"], "e": "Land at about 3.5–3.6 V per cell, and never go below 3.0 V."}}, {"id": 46, "l": "m", "a": 1, "s": "S22", "ar": {"q": "بطارية منتفخة:", "o": ["أشحنها بسرعة", "لا أشحنها ولا أستخدمها", "أستخدمها في الصيف", "أضغطها"], "e": "البطارية المنتفخة أو التالفة أو التي تعرضت لحادث لا تُشحن ولا تُستخدم."}, "en": {"q": "A swollen battery:", "o": ["Charge it quickly", "Do not charge or use it", "Use it in summer", "Squeeze it"], "e": "A swollen, damaged or crashed battery must not be charged or used."}}, {"id": 47, "l": "m", "a": 1, "s": "S22", "ar": {"q": "أين تشحن LiPo؟", "o": ["على السرير", "تحت المراقبة في حقيبة مقاومة للحريق", "في السيارة", "بلا مراقبة"], "e": "الشحن بشاحن موازنة، تحت المراقبة، في حقيبة مقاومة للحريق بعيدًا عن المواد القابلة للاشتعال."}, "en": {"q": "Where do you charge a LiPo?", "o": ["On the bed", "Supervised, inside a fire-resistant bag", "In the car", "Unattended"], "e": "Charge with a balance charger, supervised, in a fire-resistant bag away from flammable materials."}}, {"id": 48, "l": "m", "a": 1, "s": "S18", "ar": {"q": "عيب رئيسي في متعددة المراوح:", "o": ["لا تحوم", "زمن الطيران قصير", "تحتاج مدرجًا", "لا تقلع عموديًا"], "e": "عيوبها: زمن طيران قصير وحمولة محدودة."}, "en": {"q": "A main drawback of multirotors:", "o": ["Cannot hover", "Short flight time", "Need a runway", "Cannot take off vertically"], "e": "Drawbacks: short flight time and limited payload."}}, {"id": 69, "l": "m", "a": 0, "s": "S17", "ar": {"q": "ما معنى «Return to Launch»؟", "o": ["العودة لنقطة الإقلاع", "الإقلاع", "الهبوط الاضطراري في مكانه", "التصوير"], "e": "Return to Launch (RTL) = العودة لنقطة الإقلاع (المنزل)."}, "en": {"q": "What does \"Return to Launch\" mean?", "o": ["Return to the take-off point", "Take off", "Emergency landing in place", "Photography"], "e": "Return to Launch (RTL) = return to the take-off point (home)."}}, {"id": 70, "l": "m", "a": 1, "s": "S12", "ar": {"q": "ما معنى «Above Ground Level (AGL)»؟", "o": ["فوق سطح البحر", "فوق سطح الأرض", "تحت الأرض", "فوق السحاب"], "e": "AGL = فوق سطح الأرض؛ وحد الفئة المفتوحة 120 م AGL."}, "en": {"q": "What does \"Above Ground Level (AGL)\" mean?", "o": ["Above sea level", "Above the ground surface", "Below ground", "Above the clouds"], "e": "AGL = above ground level; the Open-category limit is 120 m AGL."}}, {"id": 49, "l": "a", "a": 0, "s": "S19", "ar": {"q": "الهجينة (Hybrid VTOL) تجمع بين:", "o": ["الإقلاع العمودي مع الطيران الأمامي الكفء", "الغوص تحت الماء", "الطيران بلا بطارية", "الكاميرا والمراوح"], "e": "إقلاع عمودي مع طيران أمامي كفء، وعيبها التكلفة والتعقيد والوزن الإضافي."}, "en": {"q": "A hybrid (VTOL) drone combines:", "o": ["Vertical take-off with efficient forward flight", "Underwater diving", "Flying without a battery", "Camera and propellers"], "e": "Vertical take-off plus efficient forward flight; drawbacks are cost, complexity and extra weight."}}, {"id": 50, "l": "a", "a": 1, "s": "S18", "ar": {"q": "من عيوب أحادية المروحة (هليكوبتر):", "o": ["لا تحوم", "التعقيد والاهتزاز والتكلفة", "خفيفة جدًا", "لا تحمل شيئًا"], "e": "معقدة ومكلفة واهتزازها عالٍ، لكنها تحوم بحمولة أثقل."}, "en": {"q": "A drawback of single-rotor (helicopter) drones:", "o": ["Cannot hover", "Complexity, vibration and cost", "Very light", "Cannot carry anything"], "e": "Complex, costly and high vibration, but they hover with heavier payloads."}}, {"id": 51, "l": "a", "a": 1, "s": "S21b", "ar": {"q": "علاقة دفع المروحة بسرعة دورانها:", "o": ["لا علاقة", "تتناسب تقريبًا مع مربع السرعة", "عكسية", "خطية تمامًا"], "e": "دفع المروحة يتناسب تقريبًا مع مربع سرعة دورانها."}, "en": {"q": "Relationship between propeller thrust and rotation speed:", "o": ["No relationship", "Roughly proportional to the square of the speed", "Inverse", "Exactly linear"], "e": "Propeller thrust is roughly proportional to the square of its rotation speed."}}, {"id": 52, "l": "a", "a": 1, "s": "S21b", "ar": {"q": "عند التحويم، الدفع الكلي يساوي:", "o": ["صفرًا", "الوزن (m·g)", "ضعف الوزن", "السحب"], "e": "عند التحويم الدفع الكلي = الوزن = m·g."}, "en": {"q": "When hovering, total thrust equals:", "o": ["Zero", "Weight (m·g)", "Twice the weight", "Drag"], "e": "In a hover, total thrust = weight = m·g."}}, {"id": 53, "l": "a", "a": 0, "s": "S29", "ar": {"q": "لتنعرج الرباعية عكس عقارب الساعة:", "o": ["نزيد دفع المراوح التي تدور مع عقارب الساعة", "نزيد دفع المراوح التي تدور عكس عقارب الساعة", "نطفئ محركًا", "نرفع الكاميرا"], "e": "زيادة سرعة المراوح الدائرة مع عقارب الساعة تولّد عزم رد فعل يدير الجسم عكس عقارب الساعة."}, "en": {"q": "To yaw a quadcopter counter-clockwise:", "o": ["Increase thrust of the clockwise-spinning propellers", "Increase thrust of the counter-clockwise propellers", "Turn off a motor", "Raise the camera"], "e": "Speeding up the clockwise propellers creates a reaction torque that turns the body counter-clockwise."}}, {"id": 54, "l": "a", "a": 1, "s": "S20", "ar": {"q": "ESC يغذي المحرك عديم الفرش بتيار:", "o": ["مستمر ثابت", "ثلاثي الأطوار", "لا يغذيه", "صوتي"], "e": "ESC يحوّل طاقة البطارية إلى تيار ثلاثي الأطوار للمحرك عديم الفرش."}, "en": {"q": "The ESC powers a brushless motor with:", "o": ["Steady direct current", "Three-phase current", "It does not power it", "Sound"], "e": "The ESC converts battery power into three-phase current for the brushless motor."}}, {"id": 55, "l": "a", "a": 1, "s": "S12", "ar": {"q": "يجوز تجاوز 120 م في الفئة المفتوحة إذا:", "o": ["كان الجو صافيًا", "كانت الطائرة ضمن 120 م من منشأة ولم ترتفع أكثر من 120 م فوق أعلى نقطة فيها", "كان الطيار خبيرًا", "لا يجوز أبدًا"], "e": "هذا هو استثناء الارتفاع قرب المنشآت في الجزء 107."}, "en": {"q": "In the Open category you may exceed 120 m if:", "o": ["The weather is clear", "The aircraft is within 120 m of a structure and no more than 120 m above its highest point", "The pilot is experienced", "Never allowed"], "e": "This is the structure altitude exception in Part 107."}
